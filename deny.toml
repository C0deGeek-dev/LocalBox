[advisories]
# Owner: c0degeek-dev. All four ignores below first observed 2026-08-30;
# disposition: accept indefinitely — none are directly controlled deps.
# rustls-pemfile/paste are "unmaintained"-category only, no known
# vulnerability. Both lru entries ARE real "unsound" (memory-corruption)
# advisories, not vulnerability-free — accepted because LocalBox never calls
# the affected IterMut/pop paths, not because they are harmless in general.
# Revisit if reqwest/ratatui drop the transitive that carries them.
ignore = [
    "RUSTSEC-2025-0134", # unmaintained rustls-pemfile via reqwest
    "RUSTSEC-2024-0436", # unmaintained paste via ratatui
    # lru 0.12.5 is transitive through ratatui; LocalBox does not use the
    # affected IterMut or pop APIs. Remove when ratatui updates lru. Note:
    # cargo-deny's default `unsound = "workspace"` scope does not evaluate a
    # transitive-only crate like this anyway, so `cargo audit` in CI is what
    # actually keeps this pair visible, not this ignore entry.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "PolyForm-Noncommercial-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/C0deGeek-dev/localx-llama"]
